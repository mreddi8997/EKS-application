<text x="50" y="1363" class="label" text-anchor="start">Approval status is separate from fulfilment status. Only an authorized APPROVED transition starts ticket creation.</text>
<text x="50" y="1403" class="note" text-anchor="start">S3 events ingest the form; DynamoDB Streams drive the approval-gated ServiceNow integration. Pending is not approved.</text>
