name: Terraform Infrastructure

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  TF_VERSION: "1.10.0"

jobs:
  setup:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Infra

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Verify versions
        run: terraform version

      - name: Configure provider cache
        run: |
          mkdir -p "$HOME/.terraform.d/plugin-cache"
          echo "TF_PLUGIN_CACHE_DIR=$HOME/.terraform.d/plugin-cache" >> "$GITHUB_ENV"

      - name: Restore provider cache
        id: provider-cache
        uses: actions/cache@v4
        with:
          path: ~/.terraform.d/plugin-cache
          key: tf-providers-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Infra/.terraform.lock.hcl') }}

      - name: Show cache result
        env:
          CACHE_HIT: ${{ steps.provider-cache.outputs.cache-hit }}
        run: |
          if [ "$CACHE_HIT" = "true" ]; then
            echo "Provider cache restored."
          else
            echo "No matching cache. Terraform will download providers."
          fi

      - name: Check formatting
        run: terraform fmt -recursive

      - name: Initialize for validation
        run: terraform init -backend=false

      - name: Validate configuration
        run: terraform validate

  quality:
    name: Quality Gate
    needs: setup
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Infra

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: "v0.52.0"

      - name: Initialize lint plugins
        run: tflint --init

      - name: Enforce quality rules
        run: tflint --recursive --format compact

  security:
    name: Security Gate
    needs: setup
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enforce Trivy security checks
        id: trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: Infra
          severity: HIGH,CRITICAL
          exit-code: "1"

      # Run Checkov even if Trivy reports failures.
      # The job remains failed if either scanner fails.
      - name: Setup Python and package cache
        if: ${{ !cancelled() && (success() || failure()) }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-security.txt

      - name: Install Checkov
        id: install-checkov
        if: ${{ !cancelled() && (success() || failure()) }}
        run: python -m pip install -r requirements-security.txt

      - name: Enforce Checkov policies
        if: ${{ !cancelled() && (success() || failure()) && steps.install-checkov.outcome == 'success' }}
        run: checkov -d Infra --framework terraform --hard-fail-on CRITICAL
  
  plan:
    name: Terraform Plan
    needs: [quality, security]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        working-directory: Infra

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure provider cache
        run: |
          mkdir -p "$HOME/.terraform.d/plugin-cache"
          echo "TF_PLUGIN_CACHE_DIR=$HOME/.terraform.d/plugin-cache" >> "$GITHUB_ENV"

      - name: Restore provider cache
        uses: actions/cache@v4
        with:
          path: ~/.terraform.d/plugin-cache
          key: tf-providers-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Infra/.terraform.lock.hcl') }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::431445718171:role/OIDC_github_eks-application
          aws-region: us-east-2

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Initialize remote backend
        run: terraform init -input=false -lockfile=readonly

      - name: Generate Terraform plan
        run: terraform plan -input=false -lock-timeout=5m -out=tfplan -no-color

      - name: Upload deployment plan
        id: save-plan
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          PLAN_BUCKET: ${{ vars.TF_PLAN_BUCKET }}
        run: |
          set -euo pipefail
          : "${PLAN_BUCKET:?TF_PLAN_BUCKET is not configured}"

          PLAN_KEY="plan/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/tfplan"

          aws s3 cp \
            tfplan \
            "s3://${PLAN_BUCKET}/${PLAN_KEY}" \
            --only-show-errors

          echo "plan_key=${PLAN_KEY}" >> "$GITHUB_OUTPUT"
          echo "Terraform plan uploaded to s3://${PLAN_BUCKET}/${PLAN_KEY}"
   apply:
    name: Deploy Infrastructure
    needs: plan
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production

    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        shell: bash
        working-directory: Infra

    steps:
      - name: Checkout planned commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: us-east-2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.0"
        

      - name: Terraform Init
        run: terraform init -input=false -lockfile=readonly

      - name: Download approved plan
        env:
          PLAN_BUCKET: ${{ vars.TF_PLAN_BUCKET }}
          PLAN_KEY: ${{ needs.plan.outputs.plan_key }}
        run: |
          set -euo pipefail
          : "${PLAN_BUCKET:?TF_PLAN_BUCKET is not configured}"
          : "${PLAN_KEY:?The plan job did not provide a plan key}"

          aws s3 cp \
            "s3://${PLAN_BUCKET}/${PLAN_KEY}" \
            tfplan \
            --only-show-errors

      - name: Terraform Apply
        run: terraform apply -input=false -lock-timeout=5m -no-color tfplan

      - name: Deployment Status
        run: |
          echo "Production deployment successful"
          echo "Commit: ${GITHUB_SHA}"
