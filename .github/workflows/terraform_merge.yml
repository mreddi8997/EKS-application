name: Terraform Infrastructure

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  TF_VERSION: "1.10.0"

jobs:
  setup:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Infra

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Verify versions
        run: terraform version

      - name: Configure provider cache
        run: |
          mkdir -p "$HOME/.terraform.d/plugin-cache"
          echo "TF_PLUGIN_CACHE_DIR=$HOME/.terraform.d/plugin-cache" >> "$GITHUB_ENV"

      - name: Restore provider cache
        id: provider-cache
        uses: actions/cache@v4
        with:
          path: ~/.terraform.d/plugin-cache
          key: tf-providers-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Infra/.terraform.lock.hcl') }}

      - name: Show cache result
        env:
          CACHE_HIT: ${{ steps.provider-cache.outputs.cache-hit }}
        run: |
          if [ "$CACHE_HIT" = "true" ]; then
            echo "Provider cache restored."
          else
            echo "No matching cache. Terraform will download providers."
          fi

      - name: Check formatting
        run: terraform fmt -recursive

      - name: Initialize for validation
        run: terraform init -backend=false

      - name: Validate configuration
        run: terraform validate

  quality:
    name: Quality Gate
    needs: setup
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Infra

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: "v0.52.0"

      - name: Initialize lint plugins
        run: tflint --init

      - name: Enforce quality rules
        run: tflint --recursive --format compact

  security:
    name: Security Gate
    needs: setup
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enforce Trivy security checks
        id: trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: Infra
          severity: HIGH,CRITICAL
          exit-code: "1"

      # Run Checkov even if Trivy reports failures.
      # The job remains failed if either scanner fails.
      - name: Setup Python and package cache
        if: ${{ !cancelled() && (success() || failure()) }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-security.txt

      - name: Install Checkov
        id: install-checkov
        if: ${{ !cancelled() && (success() || failure()) }}
        run: python -m pip install -r requirements-security.txt

      - name: Enforce Checkov policies
        if: ${{ !cancelled() && (success() || failure()) && steps.install-checkov.outcome == 'success' }}
        run: checkov -d Infra --framework terraform --hard-fail-on CRITICAL
