name: Terraform Infrastructure

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  TF_VERSION: "1.10.0"
  
jobs:
  setup:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Infra

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Verify versions
        run: |
          terraform version

      - name: Configure provider cache
        run: |
          mkdir -p "$HOME/.terraform.d/plugin-cache"
          echo "TF_PLUGIN_CACHE_DIR=$HOME/.terraform.d/plugin-cache" >> "$GITHUB_ENV"

      - name: Restore provider cache
        id: provider-cache
        uses: actions/cache@v4
        with:
          path: ~/.terraform.d/plugin-cache
          key: tf-providers-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Infra/.terraform.lock.hcl') }}

      - name: Show cache result
        env:
          CACHE_HIT: ${{ steps.provider-cache.outputs.cache-hit }}
        run: |
          if [ "$CACHE_HIT" = "true" ]; then
            echo "Provider cache restored."
          else
            echo "No matching cache. Terraform will download providers."
          fi   

      - name: Check formatting
        run: terraform fmt -recursive

      - name: Initialize for validation
        run: terraform init -backend=false

      - name: Validate configuration
        run: terraform validate    
          
