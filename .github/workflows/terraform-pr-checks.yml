name: Terraform PR Checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TF_VERSION: "1.10.0"
  TF_IN_AUTOMATION: "true"

jobs:
  formatting:
    name: Terraform Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Check formatting
        working-directory: Infra
        continue-on-error: true
        run: terraform fmt -check -recursive -diff

  validation:
    name: Terraform Validation
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: Infra
        shell: bash

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Validate all environments
        run: |
          failed=0

          for environment in dev test staging production; do
            directory="environments/$environment"
            echo "::group::Validate $environment"

            if terraform -chdir="$directory" init \
              -backend=false \
              -input=false \
              -lockfile=readonly; then
              if ! terraform -chdir="$directory" validate -no-color; then
                failed=1
              fi
            else
              failed=1
            fi

            echo "::endgroup::"
          done

          exit "$failed"

  lint:
    name: Terraform Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: Infra

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: "v0.52.0"

      - name: Initialize lint plugins
        run: tflint --init

      - name: Run lint checks
        run: tflint --recursive --format compact

  security:
    name: Terraform Checkov Security
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned security scanner
        run: python -m pip install -r requirements-security.txt

      - name: Scan Terraform configuration
        continue-on-error: true
        run: checkov -d Infra --framework terraform
