name: AWS OIDC Authentication Test

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  authenticate:
    name: Authenticate - ${{ matrix.environment }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    strategy:
      fail-fast: false
      matrix:
        environment: [dev, test, staging, production]

    environment:
      name: ${{ matrix.environment }}

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check environment variables
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
        run: |
          test -n "$AWS_REGION" || {
            echo "AWS_REGION is missing"
            exit 1
          }
          test -n "$AWS_ACCOUNT_ID" || {
            echo "AWS_ACCOUNT_ID is missing"
            exit 1
          }
          test -n "$AWS_ROLE_ARN" || {
            echo "AWS_ROLE_ARN is missing"
            exit 1
          }


      - name: Show decoded OIDC claims
        shell: bash
        run: |
           python <<'PY'
           import os, json, base64, urllib.request

           url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + "&audience=sts.amazonaws.com"
           request = urllib.request.Request(url, headers={
              "Authorization": "Bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]
           })
           with urllib.request.urlopen(request) as response:
              token = json.load(response)["value"]

           print("::add-mask::" + token)
           payload = token.split(".")[1]
           claims = json.loads(base64.urlsafe_b64decode(payload + "=" * (-len(payload) % 4)))
           print(json.dumps(claims, indent=2))
           PY  

      - name: Authenticate with AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: github-oidc-test-${{ github.run_id }}

      - name: Verify assumed identity
        run: aws sts get-caller-identity
