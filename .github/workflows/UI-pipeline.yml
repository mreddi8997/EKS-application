# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven
name: UI CI and Docker Hub Publish

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "retail-store-sample-app/src/ui/**"
      - "!retail-store-sample-app/src/ui/chart/**"
      - ".github/workflows/UI-pipeline.yml"


jobs:
  validation:
    runs-on: ubuntu-latest
    permissions: 
       contents: read

    defaults:
      run:
        working-directory: retail-store-sample-app/src/ui

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Make mvnw executable
      run: chmod +x ./mvnw
      working-directory: retail-store-sample-app/src/ui   
    
    - name: Build with Maven
      run: ./mvnw -B verify

  
    - name: Set up Snyk CLI to check for security issues
      uses: snyk/actions/setup@806182742461562b67788a64410098c9d9b96adb 

    - name: Run Snyk dependency scan
      working-directory: retail-store-sample-app/src/ui
      continue-on-error: true
      run: snyk test --file=pom.xml -d
      env:
       SNYK_TOKEN: ${{ secrets.SNYK}}


  build_and_push:
    needs: validation
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      IMAGE_TAG: sha-${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Docker
        run: docker --version

      - name: Build Docker image
        working-directory: retail-store-sample-app/src/ui
        run: |
          docker build \
            -t retail-ui:$IMAGE_TAG .

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Tag Docker image
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          docker tag \
            retail-ui:$IMAGE_TAG \
            "$DOCKER_USERNAME/retail-ui:$IMAGE_TAG"

      - name: Push Docker image
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          docker push "$DOCKER_USERNAME/retail-ui:$IMAGE_TAG"

      

       
