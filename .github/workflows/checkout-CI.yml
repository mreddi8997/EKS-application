name: Node.js CI

on: workflow_dispatch

jobs:
  build:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: retail-store-sample-app/src/checkout
    
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache-dependency-path: retail-store-sample-app/src/checkout/package-lock.json
    
    
    - name: install dependecies
      working-directory: retail-store-sample-app/src/checkout 
      run: yarn install --frozen-lockfile

      
    - name: Run Snyk to check for vulnerabilities 
      uses: snyk/actions/node@master
      env:
        SNYK_TOKEN: ${{ secrets.SNYK }}
      with:
        args: --severity-threshold=high
      continue-on-error: true 

    - name: Check Docker
      run: docker --version

    - name: Build Docker image
      working-directory: retail-store-sample-app/src/checkout
      env:
       IMAGE_TAG: v${{ github.run_number }}
      run: |
         docker build \
         -t retail-checkout:$IMAGE_TAG .

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Tag Docker image
      env:
       IMAGE_TAG: v${{ github.run_number }}
      run: |
        docker tag \
        retail-checkout:$IMAGE_TAG \
        ${{ secrets.DOCKER_USERNAME }}/retail-checkout:$IMAGE_TAG

    - name: Push Docker image
      env:
       IMAGE_TAG: v${{ github.run_number }}
      run: |
        docker push \
        ${{ secrets.DOCKER_USERNAME }}/retail-checkout:$IMAGE_TAG   

