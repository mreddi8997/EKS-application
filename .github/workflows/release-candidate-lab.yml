name: Release Candidate Lab

on:
  workflow_dispatch:
    inputs:
      candidate_id:
        description: "Candidate ID from release-candidates, e.g. rc-3-1"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: release-candidate-lab
  cancel-in-progress: false

jobs:
  load_candidate:
    name: Load candidate from Git
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    outputs:
      image: ${{ steps.candidate.outputs.image }}
      candidate_id: ${{ steps.candidate.outputs.candidate_id }}

    steps:
      - name: Read candidate and verify validation
        id: candidate
        uses: actions/github-script@v7
        env:
          CANDIDATE_ID: ${{ inputs.candidate_id }}
        with:
          script: |
            const id = process.env.CANDIDATE_ID.trim();

            if (!/^rc-[0-9]+-[0-9]+$/.test(id)) {
              throw new Error('Expected a candidate ID such as rc-3-1');
            }

            const {data: file} = await github.rest.repos.getContent({
              ...context.repo,
              path: `release-candidates/${id}.json`,
              ref: context.sha
            });

            if (Array.isArray(file) || file.type !== 'file') {
              throw new Error('Candidate must be a file');
            }

            const c = JSON.parse(
              Buffer.from(file.content, 'base64').toString('utf8')
            );

            if (
              c.schema_version !== 1 ||
              c.simulation !== true ||
              c.candidate_id !== id ||
              c.repository !== process.env.GITHUB_REPOSITORY ||
              c.dev_smoke !== 'passed' ||
              c.test !== 'passed' ||
              typeof c.image !== 'string' ||
              !c.image.trim() ||
              !/^[0-9]+$/.test(String(c.validation_run_id))
            ) {
              throw new Error('Invalid candidate record');
            }

            const {data: run} = await github.rest.actions.getWorkflowRun({
              ...context.repo,
              run_id: Number(c.validation_run_id)
            });

            if (
              run.path !== '.github/workflows/promotion-flow-lab.yml' ||
              run.head_branch !== 'main' ||
              run.event !== 'workflow_dispatch' ||
              run.status !== 'completed' ||
              run.conclusion !== 'success' ||
              run.head_sha !== c.validated_commit ||
              String(run.run_attempt) !== String(c.validation_attempt)
            ) {
              throw new Error('Candidate validation could not be verified');
            }

            core.setOutput('image', c.image);
            core.setOutput('candidate_id', id);

            await core.summary
              .addHeading('Selected candidate — simulation')
              .addTable([
                ['Field', 'Value'],
                ['Candidate', id],
                ['Image', c.image],
                ['Validated commit', c.validated_commit]
              ])
              .addLink('Validation evidence', run.html_url)
              .write();

  staging:
    name: "STAGING — approve selected candidate"
    needs: load_candidate
    runs-on: ubuntu-latest
    environment: staging

    env:
      IMAGE: ${{ needs.load_candidate.outputs.image }}
      CANDIDATE: ${{ needs.load_candidate.outputs.candidate_id }}

    steps:
      - name: Simulate staging deployment and verification
        run: |
          echo "SIMULATION: Candidate $CANDIDATE"
          echo "SIMULATION: Deploying $IMAGE to staging"
          echo "SIMULATION: Staging verification passed"
          echo "Staging image: $IMAGE" >> "$GITHUB_STEP_SUMMARY"

  production:
    name: "PRODUCTION — approve selected candidate"
    needs: [load_candidate, staging]
    runs-on: ubuntu-latest
    environment: production

    env:
      IMAGE: ${{ needs.load_candidate.outputs.image }}
      CANDIDATE: ${{ needs.load_candidate.outputs.candidate_id }}

    steps:
      - name: Simulate production deployment and verification
        run: |
          echo "SIMULATION: Candidate $CANDIDATE"
          echo "SIMULATION: Deploying $IMAGE to production"
          echo "SIMULATION: Production verification passed"
          echo "Production image: $IMAGE" >> "$GITHUB_STEP_SUMMARY"
