name: Deploy UI through SSH

on:
  workflow_call:
    inputs:
      target_environment:
        required: true
        type: string
      image_uri:
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy and check UI
    runs-on: ubuntu-latest
    timeout-minutes: 20

    environment:
      name: ${{ inputs.target_environment }}

    env:
      EC2_HOST: ${{ vars.EC2_HOST }}
      EC2_USER: ${{ vars.EC2_USER }}
      EC2_SSH_HOST_KEY: ${{ vars.EC2_SSH_HOST_KEY }}
      IMAGE_URI: ${{ inputs.image_uri }}

    steps:
      - name: Checkout deployment script
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Deploy through SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          test -n "$SSH_PRIVATE_KEY"
          test -n "$EC2_SSH_HOST_KEY"

          [[ "$EC2_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ "$EC2_USER" =~ ^[a-zA-Z0-9_-]+$ ]]
          [[ "$IMAGE_URI" =~ ^[0-9]{12}\.dkr\.ecr\.[a-z0-9-]+\.amazonaws\.com/[a-z0-9._/-]+@sha256:[a-f0-9]{64}$ ]]

          key_file="$RUNNER_TEMP/deployment-key"
          hosts_file="$RUNNER_TEMP/deployment-known-hosts"
          remote_script="/tmp/ui-deploy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.sh"

          trap 'rm -f "$key_file" "$hosts_file"' EXIT

          printf '%s\n' "$SSH_PRIVATE_KEY" \
            | tr -d '\r' > "$key_file"
          chmod 600 "$key_file"

          printf '%s %s\n' "$EC2_HOST" "$EC2_SSH_HOST_KEY" \
            > "$hosts_file"
          chmod 600 "$hosts_file"

          ssh_options=(
            -i "$key_file"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$hosts_file"
            -o ConnectTimeout=15
            -o ServerAliveInterval=30
            -o ServerAliveCountMax=3
          )

          # Normalize Windows line endings before copying.
          sed 's/\r$//' scripts/deploy-ui.sh > "$RUNNER_TEMP/deploy-ui.sh"

          scp "${ssh_options[@]}" \
            "$RUNNER_TEMP/deploy-ui.sh" \
            "$EC2_USER@$EC2_HOST:$remote_script"

          ssh "${ssh_options[@]}" \
            "$EC2_USER@$EC2_HOST" \
            "sudo -n bash '$remote_script' '$IMAGE_URI'"

          ssh "${ssh_options[@]}" \
            "$EC2_USER@$EC2_HOST" \
            "rm -f '$remote_script'"

      - name: Record successful deployment
        run: |
          {
            echo "### Deployment passed"
            echo "- Host: $EC2_HOST"
            echo "- Image: $IMAGE_URI"
            echo "- Readiness smoke check: passed"
          } >> "$GITHUB_STEP_SUMMARY"
