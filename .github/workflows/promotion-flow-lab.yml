name: Validate Candidate Lab

on:
  workflow_dispatch:
    inputs:
      image:
        description: "Image reference to validate (simulation)"
        required: true
        type: string
      fail_dev_smoke:
        description: "Deliberately fail dev smoke tests?"
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: candidate-validation-lab
  cancel-in-progress: false

jobs:
  dev:
    name: "DEV — simulated deployment"
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ inputs.image }}
    steps:
      - name: Simulate deployment
        run: |
          echo "SIMULATION: Deploying $IMAGE to dev"

  smoke:
    name: "DEV — simulated smoke tests"
    needs: dev
    runs-on: ubuntu-latest
    env:
      FAIL_SMOKE: ${{ inputs.fail_dev_smoke }}
    steps:
      - name: Simulate smoke tests
        run: |
          if [ "$FAIL_SMOKE" = "true" ]; then
            echo "Deliberate smoke-test failure"
            exit 1
          fi
          echo "SIMULATION: Dev smoke tests passed"

  test:
    name: "TEST — simulated deployment and tests"
    needs: smoke
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ inputs.image }}
    steps:
      - name: Simulate test deployment and testing
        run: |
          echo "SIMULATION: Deploying $IMAGE to test"
          echo "SIMULATION: Integration tests passed"

  save_candidate:
    name: Open release-candidate PR
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Create candidate file and PR
        uses: actions/github-script@v7
        env:
          IMAGE: ${{ inputs.image }}
        with:
          script: |
            const image = process.env.IMAGE.trim();
            if (!image) {
              throw new Error('Image reference cannot be empty');
            }

            const id =
              `rc-${process.env.GITHUB_RUN_NUMBER}-${process.env.GITHUB_RUN_ATTEMPT}`;
            const branch = `candidate/${id}`;
            const path = `release-candidates/${id}.json`;
            const runUrl =
              `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}` +
              `/actions/runs/${process.env.GITHUB_RUN_ID}`;

            const candidate = {
              schema_version: 1,
              simulation: true,
              candidate_id: id,
              image,
              repository: process.env.GITHUB_REPOSITORY,
              validated_commit: process.env.GITHUB_SHA,
              validation_run_id: process.env.GITHUB_RUN_ID,
              validation_attempt: process.env.GITHUB_RUN_ATTEMPT,
              validation_url: runUrl,
              dev_smoke: "passed",
              test: "passed",
              created_at: new Date().toISOString()
            };

            const {data: main} = await github.rest.git.getRef({
              ...context.repo,
              ref: 'heads/main'
            });

            await github.rest.git.createRef({
              ...context.repo,
              ref: `refs/heads/${branch}`,
              sha: main.object.sha
            });

            await github.rest.repos.createOrUpdateFileContents({
              ...context.repo,
              branch,
              path,
              message: `Record validated candidate ${id}`,
              content: Buffer.from(
                JSON.stringify(candidate, null, 2) + '\n'
              ).toString('base64')
            });

            const {data: pr} = await github.rest.pulls.create({
              ...context.repo,
              base: 'main',
              head: branch,
              title: `Release candidate: ${id}`,
              body: [
                'Records a candidate that passed the simulated dev/test jobs.',
                '',
                `Candidate: ${id}`,
                `Image: ${image}`,
                `Validation: ${runUrl}`,
                '',
                'Simulation only. No image was deployed or tested.',
                'Merge after the validation run finishes successfully.'
              ].join('\n')
            });

            await core.summary
              .addHeading('Release-candidate PR created')
              .addTable([
                ['Field', 'Value'],
                ['Candidate', id],
                ['Image', image]
              ])
              .addLink('Review candidate PR', pr.html_url)
              .write();

  
